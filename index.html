function getEasterDate(year) {
  const f = Math.floor;
  const G = year % 19;
  const C = f(year / 100);
  const H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30;
  const I = H - f(H / 28) * (1 - f(29 / (H + 1)) * f((21 - G) / 11));
  const J = (year + f(year / 4) + I + 2 - C + f(C / 4)) % 7;
  const L = I - J;
  const month = 3 + f((L + 40) / 44);
  const day = L + 28 - 31 * f(month / 4);
  return new Date(year, month - 1, day);
}

function getSeasonalBoosts() {
  const today = new Date();
  const year = today.getFullYear();
  if (today.getMonth() === 11 && today.getDate() >= 20 && today.getDate() <= 26) {
    return ["Luke 2:10", "Isaiah 9:6", "Matthew 1:21"];
  }
  const easter = getEasterDate(year);
  const diffDays = Math.floor((today - easter) / 86400000);
  if (diffDays === 0) return ["Matthew 28:6"];
  if (diffDays === -2) return ["Luke 23:46"];
  if (diffDays >= -3 && diffDays <= 3) return ["John 3:16"];
  return [];
}

let cachedPool = null;
let recentVerses = JSON.parse(localStorage.getItem("recentVerses") || "[]");
const RECENT_LIMIT = 14;

function buildWeightedPool() {
  if (cachedPool) return cachedPool;
  let pool = [];
  curatedVerses.forEach(v => {
    for (let i = 0; i < v.weight; i++) { pool.push(v.ref); }
  });
  const seasonal = getSeasonalBoosts();
  seasonal.forEach(ref => {
    for (let i = 0; i < 6; i++) { pool.push(ref); }
  });
  const filtered = pool.filter(v => !recentVerses.includes(v));
  cachedPool = filtered.length ? filtered : pool;
  return cachedPool;
}

function addToRecent(ref) {
  recentVerses.unshift(ref);
  if (recentVerses.length > RECENT_LIMIT) recentVerses.pop();
  localStorage.setItem("recentVerses", JSON.stringify(recentVerses));
}
/* =========================
   VERSES & TRANSLATIONS
========================= */
let verses = { nlt:{}, niv:{}, kjv:{} };
let translation = "nlt";
let dailyKey = "";
let currentKey = "";

async function loadTranslation(t) {
  try {
    const res = await fetch(`/BIBLE/${t.toUpperCase()}/${t.toUpperCase()}_bible.json`);
    if (!res.ok) {
      console.error("Failed to load:", t);
      return;
    }
    const data = await res.json();
    Object.entries(data).forEach(([book, chapters]) => {
      Object.entries(chapters).forEach(([chapter, versesObj]) => {
        Object.entries(versesObj).forEach(([v, text]) => {
          verses[t][`${book} ${chapter}:${v}`] = text;
        });
      });
    });
  } catch (err) {
    console.error("Error loading translation:", err);
  }
}

function getSeed(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h << 5) - h + s.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function generateDaily() {
  const today = new Date().toDateString();
  const stored = JSON.parse(localStorage.getItem("dailyVerse") || "{}");

  // 1. If we already picked today's verse, just use it.
  if (stored.date === today) {
    dailyKey = stored.key;
  } else {
    // 2. Build the weighted pool
    let pool = [];
    curatedVerses.forEach(v => {
      for (let i = 0; i < v.weight; i++) { pool.push(v.ref); }
    });

    // 3. Use the Date as a Seed to pick a verse
    // This ensures everyone in the world gets the same verse today.
    const dateSeed = getSeed(today);
    
    // 4. Prevent immediate repeats from the last 7 days
    
    // Instead of using localStorage (which is different for everyone), 
    // we use the previous 7 days' seeds to "look back" and exclude them.
    let lastSeven = [];
    for (let i = 1; i <= 7; i++) {
     let prevDate = new Date();
     prevDate.setDate(prevDate.getDate() - i);
     let prevSeed = getSeed(prevDate.toDateString());
     lastSeven.push(pool[prevSeed % pool.length]);
    }
    let availablePool = pool.filter(ref => !lastSeven.includes(ref));
    
    // If our pool got too small because of filters, fall back to the full pool
    if (availablePool.length === 0) availablePool = pool;

    dailyKey = availablePool[dateSeed % availablePool.length];

    // 5. Save today's choice globally synchronized to this date
    localStorage.setItem("dailyVerse", JSON.stringify({
      date: today,
      key: dailyKey
    }));
  }

  currentKey = dailyKey;
  updateVerse("Daily Bible Verse");
  updateStreak();
}

function showDaily() {
  trackAppEvent('view_mode_change', { 'mode': 'daily' });
  currentKey = dailyKey;
  updateVerse("Daily Bible Verse");
  dailyBtn.classList.add("active");
  randomBtn.classList.remove("active");
}

function showRandom() {
  if (typeof trackAppEvent === "function") {
    trackAppEvent('view_mode_change', { 'mode': 'random' });
  }
  
  // Re-use the weighted pool logic
  let pool = [];
  curatedVerses.forEach(v => {
    for (let i = 0; i < v.weight; i++) { pool.push(v.ref); }
  });

  // CRITICAL: This is the "Never Overlap" logic. 
  // It removes today's verse from the random options.
  const randomPool = pool.filter(ref => ref !== dailyKey);
  
  // Pick a random one from the remaining pool
  currentKey = randomPool[Math.floor(Math.random() * randomPool.length)];
  
  updateVerse("Random Bible Verse");
  
  // UI toggles
  if(window.dailyBtn) dailyBtn.classList.remove("active");
  if(window.randomBtn) randomBtn.classList.add("active");
}

function changeTranslation(t) {
  trackAppEvent('change_translation', {
    'to_translation': t
  });
  translation = t;
  if (!verses[translation] || !Object.keys(verses[translation]).length) {
    loadTranslation(t).then(() => changeTranslation(t));
    return;
  }
  if (!verses[translation][currentKey]) {
    currentKey = verses[translation][dailyKey] ? dailyKey : Object.keys(verses[translation])[0];
  }
  updateVerse(dailyBtn.classList.contains("active") ? "Daily Bible Verse" : "Random Bible Verse");
}

function updateVerse(titleText) {
  const text = verses[translation][currentKey];
  if (!text) {
    console.warn("Missing verse:", currentKey, translation);
    return;
  }
  titleEl.innerText = titleText;
  verseEl.innerHTML = text.split(" ").map(w => `<span class="word">${w}</span>`).join(" ");
  refEl.innerText = currentKey;
  dateEl.innerText = new Date().toDateString();
  window.scrollTo(0, 0);
}

/* =========================
   STREAK & MODALS
========================= */
function updateStreak() {
  const today = new Date().toDateString();
  const lastVisit = localStorage.getItem("lastVisit");
  let streak = parseInt(localStorage.getItem("streak")) || 1;

  if (lastVisit && lastVisit !== today) {
    const last = new Date(lastVisit);
    const now = new Date(today);
    const diff = Math.floor((now - last) / 86400000);
    if (diff === 1) streak++;
    else if (diff > 1) streak = 1;
  }

  localStorage.setItem("streak", streak);
  localStorage.setItem("lastVisit", today);
  
  if (document.getElementById("streakNumber")) {
    document.getElementById("streakNumber").innerText = streak;
  }

  // UI Updates for the Modal
  const streakCount = document.getElementById("streakCount");
  const streakMsg = document.getElementById("streakMsg");
  if (streakCount && streakMsg) {
    streakCount.innerText = streak + " Days";
    if (streak < 7) streakMsg.innerText = "Keep going — 7 days is your next milestone 🌿";
    else if (streak < 30) streakMsg.innerText = "You're on fire — 30 days is next 🔥";
    else streakMsg.innerText = "You're building something powerful 💪";
  }

  // --- SEQUENCED HINT LOGIC ---
  const streakHint = document.getElementById("streakHintBubble");
  const tapHint = document.getElementById("tapHintBubble");
  const hintStreakNum = document.getElementById("hintStreakNumber");

  if (hintStreakNum) hintStreakNum.innerText = streak;

  // 1. Show Streak Hint first (1s delay)
  setTimeout(() => {
    if (streakHint) {
      streakHint.classList.add("show");
      
      // 2. Hide Streak Hint after 4 seconds
      setTimeout(() => {
        streakHint.classList.remove("show");
        
        // 3. Show Tap Hint AFTER Streak Hint is gone (0.6s buffer)
        setTimeout(() => {
          if (tapHint) {
            tapHint.classList.add("show");
            // Hide Tap Hint after 5 seconds
            setTimeout(() => {
              tapHint.classList.remove("show");
            }, 5000);
          }
        }, 600); 

      }, 4000);
    }
  }, 1000);
}

function readVerse() {
  trackAppEvent('read_aloud', {
    'verse_ref': currentKey,
    'translation': translation
  });
  window.speechSynthesis.cancel(); 
  const words = document.querySelectorAll(".word");
  words.forEach(w => w.classList.remove("active"));
  
  const text = verses?.[translation]?.[currentKey];
  if (!text) return;

  const u = new SpeechSynthesisUtterance(text + " " + currentKey);
  u.rate = 0.95;
  u.pitch = 1;

  let wordIndex = 0;
  u.onboundary = (event) => {
    if (event.name === "word") {
      if (words[wordIndex]) {
        words[wordIndex].classList.add("active");
        wordIndex++;
      }
    }
  };

  setTimeout(() => {
    speechSynthesis.speak(u);
  }, 100);
}

let ambientOn = false;
function toggleAmbient() {
  trackAppEvent('ambient_toggle', { 'is_on': !ambientOn });
  const a = ambientAudio;
  if (ambientOn) {
    fadeOut(a);
  } else {
    a.volume = 0;
    a.play().catch(()=>{});
    fadeIn(a);
  }
  ambientOn = !ambientOn;
  ambientToggle.classList.toggle("active");
}

function fadeIn(a) {
  let v = 0;
  const i = setInterval(() => {
    v += 0.05;
    if (v >= 0.3) { v = 0.3; clearInterval(i); }
    a.volume = v;
  }, 100);
}

function fadeOut(a) {
  let v = a.volume;
  const i = setInterval(() => {
    v -= 0.05;
    if (v <= 0) { clearInterval(i); a.pause(); a.currentTime = 0; }
    a.volume = v;
  }, 100);
}

function showToast(msg) {
  const t = document.getElementById("toast");

  t.innerText = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);

async function shareVerse() {
  try {
    if (isSharing) return;
    isSharing = true;
    showToast("Generating image...");

    await document.fonts.ready;
    const verseText = verses?.[translation]?.[currentKey];
    if (!verseText) { isSharing = false; return; }

    const canvas = document.createElement("canvas");
    const size = 1080; 
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");

    // 1. Determine & Load Pre-Blurred Image Path (iOS Blur Fix)
    const hour = new Date().getHours();
    const isDaytime = hour >= 6 && hour < 18;
    const blurredImgPath = isDaytime 
      ? "/backgrounds/morning-blurred.png" 
      : "/backgrounds/night-blurred.png";

    const bgImg = new Image();
    bgImg.crossOrigin = "anonymous";
    bgImg.src = blurredImgPath + "?t=" + new Date().getTime(); 

    await new Promise((resolve) => {
      bgImg.onload = resolve;
      bgImg.onerror = resolve;
    });

    if (bgImg.complete && bgImg.width > 0) {
      const scale = Math.max(size / bgImg.width, size / bgImg.height);
      const drawW = bgImg.width * scale;
      const drawH = bgImg.height * scale;
      const offX = (size - drawW) / 2;
      const offY = (size - drawH) / 2;

      // Drawing the pre-blurred image directly.
      ctx.drawImage(bgImg, offX, offY, drawW, drawH);
      
      // Apply a slight tint for text legibility (essential without the card)
      ctx.fillStyle = isDaytime ? "rgba(0,0,0,0.5)" : "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, size, size);

    } else {
      ctx.fillStyle = "#0b1a2a";
      ctx.fillRect(0, 0, size, size);
    }

    // 2. NEW BRANDING: logo & URL at bottom left
    const brandingMargin = 60;
    const logoSize = 60;
    
    // A. Draw the Logo
    const logoImg = new Image();
    logoImg.crossOrigin = "anonymous";
    logoImg.src = "/logo.svg"; // Assuming /logo.svg. Update if different.

    await new Promise(resolve => {
      logoImg.onload = resolve;
      logoImg.onerror = resolve; // Continue if logo fails
    });

    if (logoImg.complete && logoImg.width > 0) {
      const logoY = size - brandingMargin - logoSize;
      ctx.filter = "drop-shadow(0 2px 8px rgba(0,0,0,0.5))"; // Helps white logo pop
      ctx.drawImage(logoImg, brandingMargin, logoY, logoSize, logoSize);
      ctx.filter = "none";
    }

    // B. Draw the URL (to the right of the logo)
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.font = "400 22px system-ui, -apple-system, sans-serif"; // Using clean UI font for URL
    const urlX = brandingMargin + logoSize + 20;
    const urlY = size - brandingMargin - (logoSize / 2) + 8; // V-centered with logo
    ctx.fillText("www.tapnpray.com", urlX, urlY);

    // 3. Verse Header & Date (Now centered at top)
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.font = "700 36px Merriweather";
    ctx.fillText("Daily Bible Verse", size / 2, 100);
    
    ctx.fillStyle = isDaytime ? "rgba(255,255,255,0.7)" : "#2fb4ff"; // Different color context for day/night
    ctx.font = "400 26px Merriweather";
    ctx.fillText(new Date().toDateString(), size / 2, 150);

    // 4. Reflow Verse Text (Now using more width)
    let fontSize = verseText.length > 200 ? 38 : 48; 
    ctx.font = `700 ${fontSize}px Merriweather`;
    ctx.fillStyle = "#ffffff";
    // Text Shadow for floating text (Crucial on Morning background)
    ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
    ctx.shadowColor = "rgba(0, 0, 0, 1)"; // Fully opaque shadow
    ctx.shadowBlur = 25;                  // Spread the shadow further
    ctx.shadowOffsetY = 6;

    const words = verseText.split(" ");
    const lines = [];
    let currentLine = "";
    // Wider text column now that the card is gone
    const maxWidth = size - 160; 

    words.forEach(word => {
      let testLine = currentLine + word + " ";
      if (ctx.measureText(testLine).width > maxWidth) {
        lines.push(currentLine.trim());
        currentLine = word + " ";
      } else {
        currentLine = testLine;
      }
    });
    lines.push(currentLine.trim());

    const lineHeight = fontSize * 1.5; // Increased line spacing for readability
    const totalTextHeight = lines.length * lineHeight;
    // Centered vertically in the available main space
    const startY = 220 + ((size - 360 - brandingMargin - totalTextHeight) / 2);

    lines.forEach((l, i) => {
      ctx.fillText(l, size / 2, startY + (i * lineHeight));
    });

    // 5. Reference (Centered under text)
    // IMPORTANT: Turn OFF shadows before drawing reference/branding
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    ctx.fillStyle = isDaytime ? "rgba(255,255,255,0.95)" : "#5cc2ff"; 
    ctx.font = "700 32px Merriweather";
    ctx.fillText(currentKey, size / 2, startY + totalTextHeight + 60);

    // --- Final Generation & Share ---
    const dataUrl = canvas.toDataURL("image/png");
    trackAppEvent('share_image_generated', { 'verse_ref': currentKey });
    
    const blob = await (await fetch(dataUrl)).blob();
    const file = new File([blob], "verse.png", { type: "image/png" });

    if (navigator.share) {
      await navigator.share({
        files: [file],
        title: 'Tap N Pray',
        text: `"${verseText}" - ${currentKey}`
      });
    } else {
      shareModal.style.display = "flex";
      saveImageBtn.onclick = () => {
        trackAppEvent('manual_image_save', { 'verse_ref': currentKey });
        const link = document.createElement("a");
        link.download = "verse.png";
        link.href = dataUrl;
        link.click();
      };
      cancelShareBtn.onclick = () => shareModal.style.display = "none";
    }
  } catch (err) {
    console.error(err);
    showToast("Share failed. Please try again.");
  } finally {
    isSharing = false;
  }
}
