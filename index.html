<style>

  #toast.show, .hint-bubble.show, #streakHintBubble.show, #tapHintBubble.show {

  .share-actions {

  .share-actions button {
    padding: 10px 16px;

  .bar {

  #expandableMenu.open {

</style>

<script>
const titleEl = document.getElementById("title");
const dateEl = document.getElementById("date");
const verseEl = document.getElementById("verse");
const refEl = document.getElementById("ref");
const translationSelect = document.getElementById("translationSelect");
const dailyBtn = document.getElementById("dailyBtn");
const randomBtn = document.getElementById("randomBtn");
const shareBtn = document.getElementById("shareBtn");
const ambientToggle = document.getElementById("ambientToggle");
const streakEl = document.getElementById("streak");
const streakModal = document.getElementById("streakModal");
const streakCount = document.getElementById("streakCount");
const streakMsg = document.getElementById("streakMsg");
const ambientAudio = document.getElementById("ambientAudio");
const helpIcon = document.getElementById("helpIcon");
const donateIcon = document.getElementById("donateIcon");
const helpModal = document.getElementById("helpModal");
const helpContent = document.getElementById("helpContent");
const shareModal = document.getElementById("shareModal");
const saveImageBtn = document.getElementById("saveImageBtn");
const cancelShareBtn = document.getElementById("cancelShareBtn");

let isSharing = false;
let verses = { nlt:{}, niv:{}, kjv:{} };
let translation = "nlt";
let dailyKey = "";
let currentKey = "";

const curatedVerses = [
  { ref: "John 3:16", weight: 5 }, { ref: "Romans 5:8", weight: 4 },
  { ref: "John 14:6", weight: 5 }, { ref: "Romans 6:23", weight: 4 },
  { ref: "Ephesians 2:8", weight: 5 }, { ref: "Ephesians 2:9", weight: 4 },
  { ref: "John 1:1", weight: 5 }, { ref: "Acts 4:12", weight: 5 },
  { ref: "Romans 10:9", weight: 5 }, { ref: "Romans 10:13", weight: 5 },
  { ref: "2 Corinthians 5:17", weight: 5 }, { ref: "John 3:17", weight: 4 },
  { ref: "Galatians 2:20", weight: 4 }, { ref: "1 John 1:9", weight: 5 },
  { ref: "Philippians 4:6", weight: 5 }, { ref: "Philippians 4:7", weight: 5 },
  { ref: "1 Peter 5:7", weight: 5 }, { ref: "John 14:27", weight: 5 },
  { ref: "Matthew 11:28", weight: 5 }, { ref: "Psalm 4:8", weight: 5 },
  { ref: "Isaiah 26:3", weight: 5 }, { ref: "Psalm 46:1", weight: 5 },
  { ref: "Joshua 1:9", weight: 5 }, { ref: "Isaiah 41:10", weight: 5 },
  { ref: "Isaiah 40:31", weight: 5 }, { ref: "Philippians 4:13", weight: 5 },
  { ref: "2 Timothy 1:7", weight: 5 }, { ref: "Psalm 27:1", weight: 5 },
  { ref: "1 Corinthians 13:4", weight: 5 }, { ref: "1 John 4:19", weight: 5 },
  { ref: "Jeremiah 29:11", weight: 5 }, { ref: "Romans 8:28", weight: 5 },
  { ref: "Proverbs 3:5", weight: 5 }, { ref: "Proverbs 3:6", weight: 5 },
  { ref: "Hebrews 11:1", weight: 5 }, { ref: "Psalm 23:4", weight: 5 }
];

async function initApp() {
  await loadTranslation(translation);
  generateDaily();
  
  // Schedule a page reload for the exact moment the daily UTC verse rolls over
  setAutoRefreshAtMidnight();
  
  dailyBtn.addEventListener("click", showDaily);
  randomBtn.addEventListener("click", showRandom);
  translationSelect.addEventListener("change", (e) => changeTranslation(e.target.value));
  shareBtn.addEventListener("click", shareVerse);
  ambientToggle.addEventListener("click", toggleAmbient);
  streakEl.addEventListener("click", openStreak);
  helpIcon.addEventListener("click", openHelp);
  document.getElementById("helpCloseBtn").addEventListener("click", closeHelp);
  donateIcon.addEventListener("click", goDonate);
  verseEl.addEventListener("click", readVerse);

  const menuFab = document.getElementById("menuFab");
  const expandableMenu = document.getElementById("expandableMenu");
  
  if (menuFab && expandableMenu) {
    menuFab.addEventListener("click", (e) => {
      e.stopPropagation(); 
      menuFab.classList.toggle("open");
      expandableMenu.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
      const isClickInside = expandableMenu.contains(e.target) || menuFab.contains(e.target);
      if (!isClickInside && expandableMenu.classList.contains("open")) {
        menuFab.classList.remove("open");
        expandableMenu.classList.remove("open");
      }
    });
  }
}

window.addEventListener("DOMContentLoaded", initApp);

const bgImages = {
  morning: "/backgrounds/morning-blurred.png",
  night: "/backgrounds/night-blurred.png"
};
let currentBackground = "";

function updateBackground() {
  const hour = new Date().getHours();
  const isDaytime = hour >= 6 && hour < 18;
  const mode = isDaytime ? "morning" : "night";
  const img = bgImages[mode];

  if (img === currentBackground) return;

  const preload = new Image();
  preload.src = img;
  preload.onload = () => {
    const bg = document.getElementById("bg-layer");
    bg.style.backgroundImage = `url('${img}')`;
    const brightness = (mode === "night") ? 0.6 : 1.0;
    document.body.style.setProperty('--brightness', brightness);
    currentBackground = img;
  };
}
updateBackground();
setInterval(updateBackground, 300000);

function getSeed(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h << 5) - h + s.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function generateDaily() {
  // Create a strict YYYY-MM-DD UTC date string so all containers match perfectly
  const d = new Date();
  const today = `${d.getUTCFullYear()}-${d.getUTCMonth() + 1}-${d.getUTCDate()}`;
  
  const stored = JSON.parse(localStorage.getItem("dailyVerse") || "{}");

  if (stored.date === today) {
    dailyKey = stored.key;
  } else {
    let pool = [];
    curatedVerses.forEach(v => {
      for (let i = 0; i < v.weight; i++) { pool.push(v.ref); }
    });

    const dateSeed = getSeed(today);
    let lastSeven = [];
    for (let i = 1; i <= 7; i++) {
       let prevDate = new Date();
       prevDate.setDate(prevDate.getDate() - i);
       let prevSeed = getSeed(prevDate.toDateString());
       lastSeven.push(pool[prevSeed % pool.length]);
    }
    let availablePool = pool.filter(ref => !lastSeven.includes(ref));
    if (availablePool.length === 0) availablePool = pool;

    dailyKey = availablePool[dateSeed % availablePool.length];

    localStorage.setItem("dailyVerse", JSON.stringify({
      date: today,
      key: dailyKey
    }));
  }

  currentKey = dailyKey;
  updateVerse("Daily Bible Verse");
  updateStreak();
}

function showDaily() {
  trackAppEvent('view_mode_change', { 'mode': 'daily' });
  currentKey = dailyKey;
  updateVerse("Daily Bible Verse");
  dailyBtn.classList.add("active");
  randomBtn.classList.remove("active");
}

function showRandom() {
  trackAppEvent('view_mode_change', { 'mode': 'random' });
  let pool = [];
  curatedVerses.forEach(v => {
    for (let i = 0; i < v.weight; i++) { pool.push(v.ref); }
  });

  const randomPool = pool.filter(ref => ref !== dailyKey);
  currentKey = randomPool[Math.floor(Math.random() * randomPool.length)];
  updateVerse("Random Bible Verse");
  dailyBtn.classList.remove("active");
  randomBtn.classList.add("active");
}

function changeTranslation(t) {
  trackAppEvent('change_translation', { 'to_translation': t });
  translation = t;
  if (!verses[translation] || !Object.keys(verses[translation]).length) {
    loadTranslation(t).then(() => changeTranslation(t));
    return;
  }
  if (!verses[translation][currentKey]) {
    currentKey = verses[translation][dailyKey] ? dailyKey : Object.keys(verses[translation])[0];
  }
  updateVerse(dailyBtn.classList.contains("active") ? "Daily Bible Verse" : "Random Bible Verse");
}

function updateVerse(titleText) {
  const text = verses[translation][currentKey];
  if (!text) {
    console.warn("Missing verse:", currentKey, translation);
    return;
  }
  titleEl.innerText = titleText;
  verseEl.innerHTML = text.split(" ").map(w => `<span class="word">${w}</span>`).join(" ");
  refEl.innerText = currentKey;
  dateEl.innerText = new Date().toDateString();
  window.scrollTo(0, 0);
}

function updateStreak() {
  const today = new Date().toDateString();
  const lastVisit = localStorage.getItem("lastVisit");
  let streak = parseInt(localStorage.getItem("streak")) || 1;

if (lastVisit && lastVisit !== today) {
    // Parse the YYYY-M-D string chunks manually to ensure timezone consistency
    const [lastY, lastM, lastD] = lastVisit.split('-').map(Number);
    const [nowY, nowM, nowD] = today.split('-').map(Number);
    
    // Create pure UTC timestamps for an exact millisecond comparison
    const lastDateObj = Date.UTC(lastY, lastM - 1, lastD);
    const nowDateObj = Date.UTC(nowY, nowM - 1, nowD);
    
    const diff = Math.floor((nowDateObj - lastDateObj) / 86400000);
    if (diff === 1) streak++;
    else if (diff > 1) streak = 1;
  }
  localStorage.setItem("streak", streak);
  localStorage.setItem("lastVisit", today);
  
  if (document.getElementById("streakNumber")) {
    document.getElementById("streakNumber").innerText = streak;
  }

  const sCount = document.getElementById("streakCount");
  const sMsg = document.getElementById("streakMsg");
  if (sCount && sMsg) {
    sCount.innerText = streak + " Days";
    if (streak < 7) sMsg.innerText = "Keep going — 7 days is your next milestone 🌿";
    else if (streak < 30) sMsg.innerText = "You're on fire — 30 days is next 🔥";
    else sMsg.innerText = "You're building something powerful 💪";
  }

  const streakHint = document.getElementById("streakHintBubble");
  const tapHint = document.getElementById("tapHintBubble");
  const hintStreakNum = document.getElementById("hintStreakNumber");

  if (hintStreakNum) hintStreakNum.innerText = streak;

  setTimeout(() => {
    if (streakHint) {
      streakHint.classList.add("show");
      setTimeout(() => {
        streakHint.classList.remove("show");
        setTimeout(() => {
          if (tapHint) {
            tapHint.classList.add("show");
            setTimeout(() => {
              tapHint.classList.remove("show");
            }, 5000);
          }
        }, 600);
      }, 4000);
    }
  }, 1000);
}

async function loadTranslation(t) {
  try {
    const res = await fetch(`/BIBLE/${t.toUpperCase()}/${t.toUpperCase()}_bible.json`);
    if (!res.ok) return;
    const data = await res.json();
    Object.entries(data).forEach(([book, chapters]) => {
      Object.entries(chapters).forEach(([chapter, versesObj]) => {
        Object.entries(versesObj).forEach(([v, text]) => {
          verses[t][`${book} ${chapter}:${v}`] = text;
        });
      });
    });
  } catch (err) {
    console.error("Error loading translation:", err);
  }
}

/* =========================
   READ ALOUD & AUDIO
========================= */
function readVerse() {
  if (typeof trackAppEvent === "function") {
    trackAppEvent('read_aloud', {
      'verse_ref': currentKey,
      'translation': translation
    });
  }
  
  window.speechSynthesis.cancel(); 
  
  const words = document.querySelectorAll(".word");
  words.forEach(w => w.classList.remove("active"));
  
  const text = verses?.[translation]?.[currentKey];
  if (!text) return;

  const u = new SpeechSynthesisUtterance(`${text} ... ${currentKey}`);
  const allVoices = window.speechSynthesis.getVoices();
  
  let premiumVoice = allVoices.find(voice => 
    voice.lang.includes('en') && 
    (voice.name.includes('Premium') || voice.name.includes('Natural') || voice.name.includes('Google US English'))
  );
  
  if (!premiumVoice) premiumVoice = allVoices.find(voice => voice.name.includes('Samantha') || voice.name.includes('Google'));
  if (!premiumVoice) premiumVoice = allVoices.find(voice => voice.lang.startsWith('en'));
  
  if (premiumVoice) u.voice = premiumVoice;

  u.rate = 0.90;
  u.pitch = 1.0;

  let wordIndex = 0;
  u.onboundary = (event) => {
    if (event.name === "word") {
      if (words[wordIndex]) {
        words.forEach(w => w.classList.remove("active"));
        words[wordIndex].classList.add("active");
        wordIndex++;
      }
    }
  };

  u.onend = () => { words.forEach(w => w.classList.remove("active")); };
  u.onerror = () => { words.forEach(w => w.classList.remove("active")); };

  setTimeout(() => { window.speechSynthesis.speak(u); }, 150);
}

if (typeof window !== "undefined" && window.speechSynthesis) {
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }
}

let ambientOn = false;
function toggleAmbient() {
  trackAppEvent('ambient_toggle', { 'is_on': !ambientOn });
  const a = ambientAudio;
  if (ambientOn) {
    fadeOut(a);
  } else {
    a.volume = 0;
    a.play().catch(()=>{});
    fadeIn(a);
  }
  ambientOn = !ambientOn;
  ambientToggle.classList.toggle("active");
}

function fadeIn(a) {
  let v = 0;
  const i = setInterval(() => {
    v += 0.05;
    if (v >= 0.3) { v = 0.3; clearInterval(i); }
    a.volume = v;
  }, 100);
}

function fadeOut(a) {
  let v = a.volume;
  const i = setInterval(() => {
    v -= 0.05;
    if (v <= 0) { clearInterval(i); a.pause(); a.currentTime = 0; }
    a.volume = v;
  }, 100);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.innerText = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

async function shareVerse() {
  try {
    if (isSharing) return;
    isSharing = true;
    showToast("Generating image...");

    await document.fonts.ready;
    const verseText = verses?.[translation]?.[currentKey];
    if (!verseText) { isSharing = false; return; }

    const canvas = document.createElement("canvas");
    const size = 1080; 
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");

    const hour = new Date().getHours();
    const isDaytime = hour >= 6 && hour < 18;
    const blurredImgPath = isDaytime ? "/backgrounds/morning-blurred.png" : "/backgrounds/night-blurred.png";

    const bgImg = new Image();
    bgImg.crossOrigin = "anonymous";
    bgImg.src = blurredImgPath + "?t=" + new Date().getTime(); 

    await new Promise((resolve) => {
      bgImg.onload = resolve;
      bgImg.onerror = resolve;
    });

    if (bgImg.complete && bgImg.width > 0) {
      const scale = Math.max(size / bgImg.width, size / bgImg.height);
      const drawW = bgImg.width * scale;
      const drawH = bgImg.height * scale;
      const offX = (size - drawW) / 2;
      const offY = (size - drawH) / 2;
      ctx.drawImage(bgImg, offX, offY, drawW, drawH);
      ctx.fillStyle = isDaytime ? "rgba(0,0,0,0.5)" : "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, size, size);
    } else {
      ctx.fillStyle = "#0b1a2a";
      ctx.fillRect(0, 0, size, size);
    }

    const brandingMargin = 60;
    const logoSize = 60;
    const logoImg = new Image();
    logoImg.crossOrigin = "anonymous";
    logoImg.src = "/logo.svg";

    await new Promise(resolve => {
      logoImg.onload = resolve;
      logoImg.onerror = resolve;
    });

    if (logoImg.complete && logoImg.width > 0) {
      const logoY = size - brandingMargin - logoSize;
      ctx.filter = "drop-shadow(0 2px 8px rgba(0,0,0,0.5))";
      ctx.drawImage(logoImg, brandingMargin, logoY, logoSize, logoSize);
      ctx.filter = "none";
    }

    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.font = "400 22px system-ui, -apple-system, sans-serif";
    const urlX = brandingMargin + logoSize + 20;
    const urlY = size - brandingMargin - (logoSize / 2) + 8;
    ctx.fillText("www.tapnpray.com", urlX, urlY);

    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.font = "700 36px Merriweather";
    ctx.fillText("Daily Bible Verse", size / 2, 100);
    
    ctx.fillStyle = isDaytime ? "rgba(255,255,255,0.7)" : "#2fb4ff";
    ctx.font = "400 26px Merriweather";
    ctx.fillText(new Date().toDateString(), size / 2, 150);

    let fontSize = verseText.length > 200 ? 38 : 48; 
    ctx.font = `700 ${fontSize}px Merriweather`;
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(0, 0, 0, 1)";
    ctx.shadowBlur = 25;                  
    ctx.shadowOffsetY = 6;

    const words = verseText.split(" ");
    const lines = [];
    let currentLine = "";
    const maxWidth = size - 160; 

    words.forEach(word => {
      let testLine = currentLine + word + " ";
      if (ctx.measureText(testLine).width > maxWidth) {
        lines.push(currentLine.trim());
        currentLine = word + " ";
      } else {
        currentLine = testLine;
      }
    });
    lines.push(currentLine.trim());

    const lineHeight = fontSize * 1.5;
    const totalTextHeight = lines.length * lineHeight;
    const startY = 220 + ((size - 360 - brandingMargin - totalTextHeight) / 2);

    lines.forEach((l, i) => {
      ctx.fillText(l, size / 2, startY + (i * lineHeight));
    });

    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    ctx.fillStyle = isDaytime ? "rgba(255,255,255,0.95)" : "#5cc2ff"; 
    ctx.font = "700 32px Merriweather";
    ctx.fillText(currentKey, size / 2, startY + totalTextHeight + 60);

    const dataUrl = canvas.toDataURL("image/png");
    trackAppEvent('share_image_generated', { 'verse_ref': currentKey });
    
    const blob = await (await fetch(dataUrl)).blob();
    const file = new File([blob], "verse.png", { type: "image/png" });

    if (navigator.share) {
      await navigator.share({
        files: [file],
        title: 'Tap N Pray',
        text: `"${verseText}" - ${currentKey}`
      });
    } else {
      shareModal.style.display = "flex";
      saveImageBtn.onclick = () => {
        trackAppEvent('manual_image_save', { 'verse_ref': currentKey });
        const link = document.createElement("a");
        link.download = "verse.png";
        link.href = dataUrl;
        link.click();
      };
      cancelShareBtn.onclick = () => shareModal.style.display = "none";
    }
  } catch (err) {
    console.error(err);
    showToast("Share failed. Please try again.");
  } finally {
    isSharing = false;
  }
}

/* =========================
   AUTO-REFRESH AT MIDNIGHT
========================= */
function setAutoRefreshAtMidnight() {
  const now = new Date();
  
  // Calculate the exact millisecond timestamp for the next UTC midnight
  const nextMidnightUTC = Date.UTC(
    now.getUTCFullYear(),
    now.getUTCMonth(),
    now.getUTCDate() + 1, // Tomorrow
    0, 0, 0, 0            // 00:00:00.000
  );
  
  const msUntilMidnight = nextMidnightUTC - now.getTime();
  
  // Set a safe maximum timeout threshold (JavaScript setTimeout handles up to ~24.8 days)
  if (msUntilMidnight > 0) {
    setTimeout(() => {
      // Force reload from server cache to sync the brand new daily verse
      window.location.reload(true);
    }, msUntilMidnight + 1000); // 1-second buffer ensures the system clock has fully ticked over
  }
}
