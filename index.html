function getEasterDate(year) {
  const f = Math.floor;
  const G = year % 19;
  const C = f(year / 100);
  const H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30;

  const J = (year + f(year / 4) + I + 2 - C + f(C / 4)) % 7;
  const L = I - J;
  const month = 3 + f((L + 40) / 44);
  const day = L + 28 - 31 * f(month / 4);

  return new Date(year, month - 1, day);
}

  if (diffDays >= -3 && diffDays <= 3) return ["John 3:16"];

  return [];
}
/* BUILD WEIGHTED POOL */
let cachedPool = null;
let recentVerses = JSON.parse(localStorage.getItem("recentVerses") || "[]");
const RECENT_LIMIT = 14; // last 14 verses remembered
function buildWeightedPool() {
  if (cachedPool) return cachedPool;

  let pool = [];

  curatedVerses.forEach(v => {
    for (let i = 0; i < v.weight; i++) {
      pool.push(v.ref);
    }
  });

  // Add seasonal boosts with HIGH weight
  const seasonal = getSeasonalBoosts();
  seasonal.forEach(ref => {
    for (let i = 0; i < 6; i++) {
      pool.push(ref);
    }
  });

  const filtered = pool.filter(v => !recentVerses.includes(v));

  cachedPool = filtered.length ? filtered : pool;

  return cachedPool;
}


/* =========================
   VERSES
========================= */
let verses = { nlt:{}, niv:{}, kjv:{} };
let translation = "nlt";
let dailyKey = "";
let currentKey = "";

async function loadTranslation(t) {
  try {
    const res = await fetch(`/BIBLE/${t.toUpperCase()}/${t.toUpperCase()}_bible.json`);
    if (!res.ok) {
  console.error("Failed to load:", t);
  return;
}
    const data = await res.json();

    Object.entries(data).forEach(([book, chapters]) => {
      Object.entries(chapters).forEach(([chapter, versesObj]) => {
        Object.entries(versesObj).forEach(([v, text]) => {
          verses[t][`${book} ${chapter}:${v}`] = text;
        });
      });
    });
  } catch {}
}

function getSeed(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h << 5) - h + s.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function generateDaily() {
  cachedPool = null;
  const today = new Date().toDateString();
  const stored = JSON.parse(localStorage.getItem("dailyVerse") || "{}");

  if (stored.date === today) {
    dailyKey = stored.key;
  } else {
    const keys = buildWeightedPool();
    if (!keys.length) return;

    dailyKey = keys[getSeed(today) % keys.length];

    localStorage.setItem("dailyVerse", JSON.stringify({
      date: today,
      key: dailyKey
    }));
  }

  currentKey = dailyKey;
  updateVerse("Daily Bible Verse");
  updateStreak();
  addToRecent(dailyKey);
}

function showDaily() {
  currentKey = dailyKey;
  updateVerse("Daily Bible Verse");
  dailyBtn.classList.add("active");
  randomBtn.classList.remove("active");
}

function showRandom() {
  const keys = buildWeightedPool();
  if (!keys.length) return;

  currentKey = keys[Math.floor(Math.random() * keys.length)];
  updateVerse("Random Bible Verse");
  addToRecent(currentKey);

  dailyBtn.classList.remove("active");
  randomBtn.classList.add("active");
}

function changeTranslation(t) {
  translation = t;

  if (!verses[translation] || !Object.keys(verses[translation]).length) return;

  if (!verses[translation][currentKey]) {
  currentKey = verses[translation][dailyKey] ? dailyKey : Object.keys(verses[translation])[0];
}

  updateVerse(
    dailyBtn.classList.contains("active")
      ? "Daily Bible Verse"
      : "Random Bible Verse"
  );
}

function updateVerse(titleText) {
  const text = verses[translation][currentKey];
  if (!text) {
    console.warn("Missing verse:", currentKey, translation);
    return;
  }

  titleEl.innerText = titleText;

  // Wraps words in spans for the "Read Aloud" highlighting feature
  verseEl.innerHTML = text
    .split(" ")
    .map(w => `<span class="word">${w}</span>`)
    .join(" ");

  refEl.innerText = currentKey;
  dateEl.innerText = new Date().toDateString();
  
  // Reset scroll position to top (safety check for internal div)
  window.scrollTo(0, 0);
}

/* =========================
   STREAK
========================= */
function updateStreak() {
  const today = new Date().toDateString();
  const lastVisit = localStorage.getItem("lastVisit");
  let streak = parseInt(localStorage.getItem("streak")) || 1;

  if (lastVisit) {
    const last = new Date(lastVisit);
    const now = new Date(today);
    const diff = Math.floor((now - last) / 86400000);

    if (diff === 1) streak++;
    else if (diff > 1) streak = 1;
  }

  localStorage.setItem("streak", streak);
  localStorage.setItem("lastVisit", today);
  // This updates the number inside your new pill button
  const streakNum = document.getElementById("streakNumber");
  if (streakNum) {
    streakNum.innerText = streak;
  }

  streakEl.classList.add("active");
  streakCount.innerText = streak + " Days";

  if (streak < 7) {
    streakMsg.innerText = "Keep going — 7 days is your next milestone 🌿";
  } else if (streak < 30) {
    streakMsg.innerText = "You're on fire — 30 days is next 🔥";
  } else if (streak < 100) {
    streakMsg.innerText = "Stay strong — 100 days is next 👑";
  } else {
    streakMsg.innerText = "You're building something powerful 💪";
  }

  b7.classList.toggle("active", streak >= 7);
  b30.classList.toggle("active", streak >= 30);
  b100.classList.toggle("active", streak >= 100);

  let goal = 7;
  if (streak >= 7) goal = 30;
  if (streak >= 30) goal = 100;

  const progress = (streak / goal) * 100;
  progressBar.style.width = Math.min(progress, 100) + "%";
}

/* =========================
   READ
========================= */
function readVerse() {
  // Stops any current speaking before starting the new one
  window.speechSynthesis.cancel(); 
  
  const words = document.querySelectorAll(".word");
  words.forEach(w => w.classList.remove("active"));
  let wordIndex = 0;

  let i = 0;

  const text = verses?.[translation]?.[currentKey];
  if (!text) return;

  const u = new SpeechSynthesisUtterance(text + " " + currentKey);

  u.rate = 0.95;
  u.pitch = 1;

  u.onboundary = (event) => {
  if (event.name === "word") {
    if (words[wordIndex]) {
      words[wordIndex].classList.add("active");
      wordIndex++;
    }
  }
};

  // tiny delay prevents clipping on mobile
  wordIndex = 0;
  setTimeout(() => {
    speechSynthesis.speak(u);
  }, 100);
}

/* =========================
   AMBIENT
========================= */
let ambientOn = false;

function toggleAmbient() {
  const a = ambientAudio;

  if (ambientOn) {
    fadeOut(a);
  } else {
    a.volume = 0;
    a.play().catch(()=>{});
    fadeIn(a);
  }

  ambientOn = !ambientOn;
  ambientToggle.classList.toggle("active");
}

function fadeIn(a) {
  let v = 0;
  const i = setInterval(() => {
    v += 0.05;
    if (v >= 0.3) {
      v = 0.3;
      clearInterval(i);
    }
    a.volume = v;
  }, 100);
}

function fadeOut(a) {
  let v = a.volume;
  const i = setInterval(() => {
    v -= 0.05;
    if (v <= 0) {
      clearInterval(i);
      a.pause();
      a.currentTime = 0;
    }
    a.volume = v;
  }, 100);
}

async function shareVerse() {
  try {
    if (isSharing) return;
    isSharing = true;
    showToast("Generating image...");

    await document.fonts.ready;
    const verseText = verses?.[translation]?.[currentKey];
    if (!verseText) { isSharing = false; return; }

    const canvas = document.createElement("canvas");
    const size = 1080; 
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");

/* =========================
       1. BACKGROUND (FORCE-RENDER BLUR)
    ========================= */
    const bgImg = new Image();
    bgImg.crossOrigin = "anonymous";
    bgImg.src = currentBackground + "?t=" + new Date().getTime(); 

    await new Promise((resolve) => {
      bgImg.onload = resolve;
      bgImg.onerror = resolve;
    });

    if (bgImg.complete && bgImg.width > 0) {
      const scale = Math.max(size / bgImg.width, size / bgImg.height);
      const drawW = bgImg.width * scale;
      const drawH = bgImg.height * scale;
      const offX = (size - drawW) / 2;
      const offY = (size - drawH) / 2;

      // 1. Set the filter
      ctx.filter = "blur(30px) brightness(0.6)";
      
      // 2. The "Triple Draw" Hack for iOS
      // We draw it once to 'prime' the engine
      ctx.drawImage(bgImg, offX - 100, offY - 100, drawW + 200, drawH + 200);
      
      // 3. Tiny delay to let the GPU catch up
      await new Promise(r => setTimeout(r, 15));
      
      // 4. Draw it again to force the blur to "stick"
      ctx.drawImage(bgImg, offX - 100, offY - 100, drawW + 200, drawH + 200);

      // 5. Reset filter so text stays sharp
      ctx.filter = "none";
      
    } else {
      ctx.fillStyle = "#0b1a2a";
      ctx.fillRect(0, 0, size, size);
    }
    /* =========================
       2. THE GLASS CARD
    ========================= */
    const cardX = 80, cardY = 160, cardW = 920, cardH = 650, r = 40;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    if (ctx.roundRect) {
        ctx.roundRect(cardX, cardY, cardW, cardH, r);
    } else {
        ctx.rect(cardX, cardY, cardW, cardH);
    }
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.lineWidth = 2;
    ctx.stroke();

    /* =========================
       3. TEXT DYNAMICS (PREVENT OVERFLOW)
    ========================= */
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff";
    ctx.font = "700 32px Merriweather";
    ctx.fillText("Daily Bible Verse", size / 2, cardY + 70);
    
    ctx.fillStyle = "#2fb4ff";
    ctx.font = "400 24px Merriweather";
    ctx.fillText(new Date().toDateString(), size / 2, cardY + 110);

    // Dynamic sizing for long verses like Isaiah 43:2
    let fontSize = verseText.length > 180 ? 36 : 46; 
    ctx.font = `700 ${fontSize}px Merriweather`;
    ctx.fillStyle = "#ffffff";

    const words = verseText.split(" ");
    const lines = [];
    let currentLine = "";
    const maxWidth = cardW - 140;

    words.forEach(word => {
      let testLine = currentLine + word + " ";
      if (ctx.measureText(testLine).width > maxWidth) {
        lines.push(currentLine.trim());
        currentLine = word + " ";
      } else {
        currentLine = testLine;
      }
    });
    lines.push(currentLine.trim());

    const lineHeight = fontSize * 1.4;
    const totalTextHeight = lines.length * lineHeight;
    // Calculate vertical center relative to the card's usable space
    const startY = cardY + 200 + ((cardH - 320 - totalTextHeight) / 2);

    lines.forEach((l, i) => {
      ctx.fillText(l, size / 2, startY + (i * lineHeight));
    });

    /* =========================
       4. REFERENCE & BRANDING
    ========================= */
    ctx.font = "700 34px Merriweather";
    ctx.fillStyle = "#2fb4ff";
    ctx.fillText(currentKey, size / 2, cardY + cardH - 60);

    ctx.font = "700 22px Merriweather";
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.fillText("tapnpray.github.io", size / 2, size - 60);

    /* =========================
       5. EXPORT
    ========================= */
    canvas.toBlob(async (blob) => {
      if (!blob) { isSharing = false; return; }
      const file = new File([blob], "tapnpray.png", { type: "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: "Tap N Pray",
            text: `${verseText}\n\n${currentKey}`
          });
        } catch (err) {
          if (err.name !== "AbortError") openShareModalWithBlob(blob);
        }
      } else {
        openShareModalWithBlob(blob);
      }
      isSharing = false;
    }, "image/png");

  } catch (err) {
    console.error(err);
    isSharing = false;
  }
}

function openShareModalWithBlob(blob) {
  window._shareBlob = blob;
  shareModal.style.display = "flex";
}

function addToRecent(key) {
  if (!key) return;

  // Add to start of array
  recentVerses.unshift(key);

  // Keep only the last 14 (RECENT_LIMIT)
  if (recentVerses.length > RECENT_LIMIT) {
    recentVerses.pop();
  }

  localStorage.setItem("recentVerses", JSON.stringify(recentVerses));
}
