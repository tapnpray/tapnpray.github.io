function getEasterDate(year) {
  const f = Math.floor;
  const G = year % 19;
  const C = f(year / 100);
  const H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30;
  const I = H - f(H / 28) * (1 - f(29 / (H + 1)) * f((21 - G) / 11));
  const J = (year + f(year / 4) + I + 2 - C + f(C / 4)) % 7;
  const L = I - J;
  const month = 3 + f((L + 40) / 44);
  const day = L + 28 - 31 * f(month / 4);
  return new Date(Date.UTC(year, month - 1, day));
}

  const today = new Date();
  const year = today.getUTCFullYear();
  if (today.getUTCMonth() === 11 && today.getUTCDate() >= 20 && today.getUTCDate() <= 26) {
    return ["Luke 2:10", "Isaiah 9:6", "Matthew 1:21"];
  }
  const easter = getEasterDate(year);
  const diffDays = Math.floor((today - easter) / 86400000);
  if (diffDays === 0) return ["Matthew 28:6"];
  if (diffDays === -2) return ["Luke 23:46"];
  if (diffDays >= -3 && diffDays <= 3) return ["John 3:16"];
  return [];
}

let cachedPool = null;
let recentVerses = JSON.parse(localStorage.getItem("recentVerses") || "[]");
const RECENT_LIMIT = 14;

// NEW: A pure, mathematical pool that is identical on every single device
function getStaticPool() {
  let pool = [];
  curatedVerses.forEach(v => {
    for (let i = 0; i < v.weight; i++) { pool.push(v.ref); }
  });
  const seasonal = getSeasonalBoosts();
  seasonal.forEach(ref => {
    for (let i = 0; i < 6; i++) { pool.push(ref); }
  });
  pool.sort(); // Guarantees the exact same order across all browsers
  return pool;
}

// UPDATED: Only used for the Random button now
function buildWeightedPool() {
  if (cachedPool) return cachedPool;
  
  let pool = getStaticPool(); 
  
  const filtered = pool.filter(v => !recentVerses.includes(v));
  
  if (filtered.length === 0) {
    recentVerses = [];
    localStorage.removeItem("recentVerses");
    cachedPool = pool;
  } else {
    cachedPool = filtered;
  }
  return cachedPool;
}

function addToRecent(ref) {
  recentVerses.unshift(ref);
  if (recentVerses.length > RECENT_LIMIT) recentVerses.pop();
  localStorage.setItem("recentVerses", JSON.stringify(recentVerses));
}

function getSeed(str) {
  let h1 = 1779033703;
  let h2 = 3144134277;

  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 3432918353);
    h2 = Math.imul(h2 ^ ch, 2246822507);
  }

  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
  h2 = Math.imul(h2 ^ (h2 >>> 13), 3266489909);

  return Math.abs((h1 ^ h2) >>> 0);
}

function setAutoRefreshAtMidnight() {
  const now = new Date();

  // Next UTC midnight
  const nextMidnightUTC = new Date(Date.UTC(
    now.getUTCFullYear(),
    now.getUTCMonth(),
    now.getUTCDate() + 1,
    0, 0, 0, 0
  ));

  const msUntilMidnight = nextMidnightUTC.getTime() - now.getTime();

  setTimeout(() => {
    generateDaily();

    // Continue refreshing every 24h
    setInterval(generateDaily, 86400000);

  }, msUntilMidnight);
}  
  
window.addEventListener("DOMContentLoaded", initApp);

/* =========================
   BACKGROUNDS
========================= */
const bgImages = {
  morning: "/backgrounds/morning-blurred.png",
  night: "/backgrounds/night-blurred.png"
};
let currentBackground = "";

function updateBackground() {
  const hour = new Date().getHours();
  const isDaytime = hour >= 6 && hour < 18;
  const mode = isDaytime ? "morning" : "night";
  const img = bgImages[mode];

  if (img === currentBackground) return;

  const preload = new Image();
  preload.src = img;
  preload.onload = () => {
    const bg = document.getElementById("bg-layer");
    bg.style.backgroundImage = `url('${img}')`;
    const brightness = (mode === "night") ? 0.6 : 1.0;
    document.body.style.setProperty('--brightness', brightness);
    currentBackground = img;
  };
}
function generateDaily() {
  // TRUE UTC DATE KEY (same worldwide)
  const now = new Date();

  const utcYear = now.getUTCFullYear();
  const utcMonth = String(now.getUTCMonth() + 1).padStart(2, "0");
  const utcDay = String(now.getUTCDate()).padStart(2, "0");

  const todayUTC = `${utcYear}-${utcMonth}-${utcDay}`;

  const stored = JSON.parse(localStorage.getItem("dailyVerse") || "{}");

  // Reuse today's verse if already generated
  if (stored.date === todayUTC && stored.key) {
    dailyKey = stored.key;
  } else {
    cachedPool = null;

    // Identical pool for all users/devices
    const pool = getStaticPool();

    // Stable deterministic seed
    const dateSeed = getSeed(todayUTC);

    dailyKey = pool[dateSeed % pool.length];

    localStorage.setItem("dailyVerse", JSON.stringify({
      date: todayUTC,
      key: dailyKey
    }));
  }

  currentKey = dailyKey;

  addToRecent(dailyKey);

  updateVerse("Daily Bible Verse");

  updateStreak();
}

function showDaily() {
  if (typeof trackAppEvent === 'function') {
    trackAppEvent('view_mode_change', { 'mode': 'daily' });
  }
  currentKey = dailyKey;
  updateVerse("Daily Bible Verse");
  dailyBtn.classList.add("active");
  randomBtn.classList.remove("active");
}

function showRandom() {
  if (typeof trackAppEvent === 'function') {
    trackAppEvent('view_mode_change', { 'mode': 'random' });
  }
  const pool = buildWeightedPool();
  const randomPool = pool.filter(ref => ref !== dailyKey);
  const activePool = randomPool.length ? randomPool : pool;

  currentKey = activePool[Math.floor(Math.random() * activePool.length)];
  addToRecent(currentKey);
  
  updateVerse("Random Bible Verse");
  dailyBtn.classList.remove("active");
  randomBtn.classList.add("active");
}

function changeTranslation(t) {
  if (typeof trackAppEvent === 'function') {
    trackAppEvent('change_translation', { 'to_translation': t });
  }
  translation = t;
  if (!verses[translation] || !Object.keys(verses[translation]).length) {
    loadTranslation(t).then(() => {
      updateVerse(dailyBtn.classList.contains("active") ? "Daily Bible Verse" : "Random Bible Verse");
    });
    return;
  }
  if (!verses[translation][currentKey]) {
    currentKey = verses[translation][dailyKey] ? dailyKey : Object.keys(verses[translation])[0];
  }
  updateVerse(dailyBtn.classList.contains("active") ? "Daily Bible Verse" : "Random Bible Verse");
}

function updateVerse(titleText) {
  const text = verses[translation][currentKey];
  if (!text) {
    console.warn("Missing verse:", currentKey, translation);
    return;
  }
  titleEl.innerText = titleText;
  verseEl.innerHTML = text.split(" ").map(w => `<span class="word">${w}</span>`).join(" ");
  
  // SECURE CLICK RE-BIND: Re-attach the handler cleanly to the freshly rendered layout
  verseEl.onclick = () => {
    readVerse();
  };

refEl.innerText = currentKey;
  // Match the display date to the same logic used for the daily seed
  const d = new Date();

const weekday = d.toLocaleDateString('en-US', { weekday: 'short' });
const month = d.toLocaleDateString('en-US', { month: 'short' });

dateEl.innerText = `${weekday} ${month} ${d.getDate()} ${d.getFullYear()}`;
  window.scrollTo(0, 0);
}

function updateStreak() {
  // Use stable UTC date format
  const now = new Date();

  const today =
    now.getUTCFullYear() + "-" +
    String(now.getUTCMonth() + 1).padStart(2, "0") + "-" +
    String(now.getUTCDate()).padStart(2, "0");

  const lastVisit = localStorage.getItem("lastVisit");
  let streak = parseInt(localStorage.getItem("streak")) || 1;

  if (lastVisit && lastVisit !== today) {
    const [lastY, lastM, lastD] = lastVisit.split("-").map(Number);

    const lastDateUTC = Date.UTC(lastY, lastM - 1, lastD);

    const todayUTC = Date.UTC(
      now.getUTCFullYear(),
      now.getUTCMonth(),
      now.getUTCDate()
    );

    const diff = Math.floor((todayUTC - lastDateUTC) / 86400000);

    if (diff === 1) {
      streak++;
    } else if (diff > 1) {
      streak = 1;
    }
  }

  localStorage.setItem("streak", streak);
  localStorage.setItem("lastVisit", today);

  if (document.getElementById("streakNumber")) {
    document.getElementById("streakNumber").innerText = streak;
  }

  const sCount = document.getElementById("streakCount");
  const sMsg = document.getElementById("streakMsg");

  if (sCount && sMsg) {
    sCount.innerText = streak + " Days";

    if (streak < 7) {
      sMsg.innerText = "Keep going — 7 days is your next milestone 🌿";
    } else if (streak < 30) {
      sMsg.innerText = "You're on fire — 30 days is next 🔥";
    } else {
      sMsg.innerText = "You're building something powerful 💪";
    }
  }

  const streakHint = document.getElementById("streakHintBubble");
  const tapHint = document.getElementById("tapHintBubble");
  const hintStreakNum = document.getElementById("hintStreakNumber");

  if (hintStreakNum) {
    hintStreakNum.innerText = streak;
  }

  setTimeout(() => {
    if (streakHint) {
      streakHint.classList.add("show");

      setTimeout(() => {
        streakHint.classList.remove("show");

        setTimeout(() => {
          if (tapHint) {
            tapHint.classList.add("show");

            setTimeout(() => {
              tapHint.classList.remove("show");
            }, 5000);
          }
        }, 600);
      }, 4000);
    }
  }, 1000);
}

async function loadTranslation(t) {
  try {
    const res = await fetch(`/BIBLE/${t.toUpperCase()}/${t.toUpperCase()}_bible.json`);
    if (!res.ok) return;
    const data = await res.json();
    Object.entries(data).forEach(([book, chapters]) => {
      Object.entries(chapters).forEach(([chapter, versesObj]) => {
        Object.entries(versesObj).forEach(([v, text]) => {
          verses[t][`${book} ${chapter}:${v}`] = text;
        });
      });
    });
  } catch (err) {
    console.error("Error loading translation:", err);
  }
}

/* =========================
   READ ALOUD & AUDIO
========================= */
function readVerse() {
  if (typeof trackAppEvent === "function") {
    trackAppEvent('read_aloud', {
      'verse_ref': currentKey,
      'translation': translation
    });
  }
  
  window.speechSynthesis.cancel(); 
  
  const words = document.querySelectorAll(".word");
  words.forEach(w => w.classList.remove("active"));
  
  const text = verses?.[translation]?.[currentKey];
  if (!text) return;

  // Wrap speech execution in a brief timeout to let mobile audio engines completely clear their queues
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(`${text} ... ${currentKey}`);
    let allVoices = window.speechSynthesis.getVoices();

if (!allVoices.length) {
  window.speechSynthesis.getVoices();
  allVoices = window.speechSynthesis.getVoices();
}
    
    let premiumVoice = allVoices.find(voice => 
      voice.lang.includes('en') && 
      (voice.name.includes('Premium') || voice.name.includes('Natural') || voice.name.includes('Google US English'))
    );
    
    if (!premiumVoice) premiumVoice = allVoices.find(voice => voice.name.includes('Samantha') || voice.name.includes('Google'));
    if (!premiumVoice) premiumVoice = allVoices.find(voice => voice.lang.startsWith('en'));
    
    if (premiumVoice) u.voice = premiumVoice;

    u.rate = 0.90;
    u.pitch = 1.0;

    let wordIndex = 0;
    u.onboundary = (event) => {
      if (event.name === "word") {
        if (words[wordIndex]) {
          words.forEach(w => w.classList.remove("active"));
          words[wordIndex].classList.add("active");
          wordIndex++;
        }
      }
    };

u.onend = () => { words.forEach(w => w.classList.remove("active")); };
    u.onerror = () => { words.forEach(w => w.classList.remove("active")); };

    setTimeout(() => {
      window.speechSynthesis.speak(u);
    }, 100);
  }, 50);
}

// Clean cross-browser engine initialization listener
if (typeof window !== "undefined" && window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }
}

let ambientOn = false;
function toggleAmbient() {
  if (typeof trackAppEvent === 'function') {
    trackAppEvent('ambient_toggle', { 'is_on': !ambientOn });
  }
  const a = ambientAudio;
  if (ambientOn) {
    if (typeof fadeOut === 'function') {
      fadeOut(a);
    } else {
      a.pause();
    }
  } else {
    a.volume = 0.5;
    a.play().catch(()=>{});
    if (typeof fadeIn === 'function') {
      fadeIn(a);
    }
  }
ambientOn = !ambientOn;
  ambientToggle.classList.toggle("active");
}

function fadeIn(a) {
  let v = 0;
  const i = setInterval(() => {
    v += 0.05;
    if (v >= 0.3) { v = 0.3; clearInterval(i); }
    a.volume = v;
  }, 100);
}

function fadeOut(a) {
  let v = a.volume;
  const i = setInterval(() => {
    v -= 0.05;
    if (v <= 0) { clearInterval(i); a.pause(); a.currentTime = 0; }
    a.volume = v;
  }, 100);
}

/* =========================
   SHARE IMAGE GENERATOR (Minimalist Style)
========================= */
function showToast(msg) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.innerText = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

async function shareVerse() {
  try {
    if (isSharing) return;
    isSharing = true;
    showToast("Generating image...");

    await document.fonts.ready;
    const verseText = verses?.[translation]?.[currentKey];
    if (!verseText) { isSharing = false; return; }

    const canvas = document.createElement("canvas");
    const size = 1080; 
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");

    // 1. Determine & Load Pre-Blurred Image Path
    const hour = new Date().getHours();
    const isDaytime = hour >= 6 && hour < 18;
    const blurredImgPath = isDaytime 
      ? "/backgrounds/morning-blurred.png" 
      : "/backgrounds/night-blurred.png";

    const bgImg = new Image();
    bgImg.crossOrigin = "anonymous";
    bgImg.src = blurredImgPath + "?t=" + new Date().getTime(); 

    await new Promise((resolve) => {
      bgImg.onload = resolve;
      bgImg.onerror = resolve;
    });

    if (bgImg.complete && bgImg.width > 0) {
      const scale = Math.max(size / bgImg.width, size / bgImg.height);
      const drawW = bgImg.width * scale;
      const drawH = bgImg.height * scale;
      const offX = (size - drawW) / 2;
      const offY = (size - drawH) / 2;

      ctx.drawImage(bgImg, offX, offY, drawW, drawH);
      
      // Apply a slight tint for text legibility
      ctx.fillStyle = isDaytime ? "rgba(0,0,0,0.5)" : "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, size, size);
    } else {
      ctx.fillStyle = "#0b1a2a";
      ctx.fillRect(0, 0, size, size);
    }

    // 2. BRANDING: logo & URL at bottom left
    const brandingMargin = 60;
    const logoSize = 60;
    
    const logoImg = new Image();
    logoImg.crossOrigin = "anonymous";
    logoImg.src = "/logo.svg"; 

    await new Promise(resolve => {
      logoImg.onload = resolve;
      logoImg.onerror = resolve; 
    });

    if (logoImg.complete && logoImg.width > 0) {
      const logoY = size - brandingMargin - logoSize;
      ctx.filter = "drop-shadow(0 2px 8px rgba(0,0,0,0.5))"; 
      ctx.drawImage(logoImg, brandingMargin, logoY, logoSize, logoSize);
      ctx.filter = "none";
    }

    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.font = "400 22px system-ui, -apple-system, sans-serif"; 
    const urlX = brandingMargin + logoSize + 20;
    const urlY = size - brandingMargin - (logoSize / 2) + 8; 
    ctx.fillText("www.tapnpray.com", urlX, urlY);

    // 3. Verse Header & Date
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.font = "700 36px Merriweather";
    ctx.fillText("Daily Bible Verse", size / 2, 100);
    
    ctx.fillStyle = isDaytime ? "rgba(255,255,255,0.7)" : "#2fb4ff"; 
    ctx.font = "400 26px Merriweather";
    ctx.fillText(new Date().toDateString(), size / 2, 150);

    // 4. Reflow Verse Text
    let fontSize = verseText.length > 200 ? 38 : 48; 
    ctx.font = `700 ${fontSize}px Merriweather`;
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(0, 0, 0, 1)"; 
    ctx.shadowBlur = 25;                  
    ctx.shadowOffsetY = 6;

    const words = verseText.split(" ");
    const lines = [];
    let currentLine = "";
    const maxWidth = size - 160; 

    words.forEach(word => {
      let testLine = currentLine + word + " ";
      if (ctx.measureText(testLine).width > maxWidth) {
        lines.push(currentLine.trim());
        currentLine = word + " ";
      } else {
        currentLine = testLine;
      }
    });
    lines.push(currentLine.trim());

    const lineHeight = fontSize * 1.5; 
    const totalTextHeight = lines.length * lineHeight;
    const startY = 220 + ((size - 360 - brandingMargin - totalTextHeight) / 2);

    lines.forEach((l, i) => {
      ctx.fillText(l, size / 2, startY + (i * lineHeight));
    });

    // 5. Reference
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    ctx.fillStyle = isDaytime ? "rgba(255,255,255,0.95)" : "#5cc2ff"; 
    ctx.font = "700 32px Merriweather";
    ctx.fillText(currentKey, size / 2, startY + totalTextHeight + 60);

    // --- Final Generation & Share ---
    const dataUrl = canvas.toDataURL("image/png");
    if (typeof trackAppEvent === 'function') {
      trackAppEvent('share_image_generated', { 'verse_ref': currentKey });
    }
    
    const blob = await (await fetch(dataUrl)).blob();
    const file = new File([blob], "verse.png", { type: "image/png" });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: 'Tap N Pray',
        text: `"${verseText}" - ${currentKey}`
      });
    } else {
      shareModal.style.display = "flex";
      saveImageBtn.onclick = () => {
        if (typeof trackAppEvent === 'function') {
          trackAppEvent('manual_image_save', { 'verse_ref': currentKey });
        }
        const link = document.createElement("a");
        link.download = "verse.png";
        link.href = dataUrl;
        link.click();
        shareModal.style.display = "none";
      };
      cancelShareBtn.onclick = () => shareModal.style.display = "none";
    }
  } catch (err) {
    console.error(err);
    showToast("Share failed. Please try again.");
  } finally {
    isSharing = false;
  }
}
