function getEasterDate(year) {
  const f = Math.floor;
  const G = year % 19;
  const C = f(year / 100);
  const H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30;
  const I = H - f(H / 28) * (1 - f(29 / (H + 1)) * f((21 - G) / 11));
  const J = (year + f(year / 4) + I + 2 - C + f(C / 4)) % 7;
  const L = I - J;
  const month = 3 + f((L + 40) / 44);
  const day = L + 28 - 31 * f(month / 4);
  return new Date(year, month - 1, day);
}

function getSeasonalBoosts() {
  const today = new Date();
  const year = today.getUTCFullYear();
  if (today.getUTCMonth() === 11 && today.getUTCDate() >= 20 && today.getUTCDate() <= 26) {
    return ["Luke 2:10", "Isaiah 9:6", "Matthew 1:21"];
  }
  const easter = getEasterDate(year);
  const diffDays = Math.floor((today - easter) / 86400000);
  if (diffDays === 0) return ["Matthew 28:6"];
  if (diffDays === -2) return ["Luke 23:46"];
  if (diffDays >= -3 && diffDays <= 3) return ["John 3:16"];
  return [];
}

let cachedPool = null;
let recentVerses = JSON.parse(localStorage.getItem("recentVerses") || "[]");
const RECENT_LIMIT = 14;

function buildWeightedPool() {
  if (cachedPool) return cachedPool;
  let pool = [];
  curatedVerses.forEach(v => {
    for (let i = 0; i < v.weight; i++) { pool.push(v.ref); }
  });
  const seasonal = getSeasonalBoosts();
  seasonal.forEach(ref => {
    for (let i = 0; i < 6; i++) { pool.push(ref); }
  });
const filtered = pool.filter(v => !recentVerses.includes(v));
  if (filtered.length === 0) {
    recentVerses = [];
    localStorage.removeItem("recentVerses");
    cachedPool = pool;
  } else {
    cachedPool = filtered;
  }
  return cachedPool;
}

function addToRecent(ref) {
  recentVerses.unshift(ref);
  if (recentVerses.length > RECENT_LIMIT) recentVerses.pop();
  localStorage.setItem("recentVerses", JSON.stringify(recentVerses));
}

function getSeed(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h << 5) - h + s.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

// --- APP CORE FRAMEWORK ---
async function initApp() {
  await loadTranslation(translation);
  generateDaily();
  
  if (typeof setAutoRefreshAtMidnight === 'function') {
    setAutoRefreshAtMidnight();
  }
  
  dailyBtn.addEventListener("click", showDaily);
  randomBtn.addEventListener("click", showRandom);
  translationSelect.addEventListener("change", (e) => changeTranslation(e.target.value));
  shareBtn.addEventListener("click", shareVerse);
  ambientToggle.addEventListener("click", toggleAmbient);
  streakEl.addEventListener("click", openStreak);
  helpIcon.addEventListener("click", openHelp);
  document.getElementById("helpCloseBtn").addEventListener("click", closeHelp);
  donateIcon.addEventListener("click", goDonate);
  verseEl.addEventListener("click", readVerse);

  const menuFab = document.getElementById("menuFab");
  const expandableMenu = document.getElementById("expandableMenu");
  
  if (menuFab && expandableMenu) {
    menuFab.addEventListener("click", (e) => {
      e.stopPropagation(); 
      menuFab.classList.toggle("open");
      expandableMenu.classList.toggle("open");
    });

document.addEventListener("click", (e) => {
      // If the menu isn't open, ignore this global click filter completely
      if (!expandableMenu.classList.contains("open")) return;
      
      // If the user clicked outside both the menu and the FAB button, close it safely
      if (!expandableMenu.contains(e.target) && !menuFab.contains(e.target)) {
        menuFab.classList.remove("open");
        expandableMenu.classList.remove("open");
      }
    });
  }
}

window.addEventListener("DOMContentLoaded", initApp);

/* =========================
   BACKGROUNDS
========================= */
const bgImages = {
  morning: "/backgrounds/morning-blurred.png",
  night: "/backgrounds/night-blurred.png"
};
let currentBackground = "";

function updateBackground() {
  const hour = new Date().getHours();
  const isDaytime = hour >= 6 && hour < 18;
  const mode = isDaytime ? "morning" : "night";
  const img = bgImages[mode];

  if (img === currentBackground) return;

  const preload = new Image();
  preload.src = img;
  preload.onload = () => {
    const bg = document.getElementById("bg-layer");
    bg.style.backgroundImage = `url('${img}')`;
    const brightness = (mode === "night") ? 0.6 : 1.0;
    document.body.style.setProperty('--brightness', brightness);
    currentBackground = img;
  };
}
updateBackground();
setInterval(updateBackground, 300000);

function generateDaily() {
  const d = new Date();
  const today = `${d.getUTCFullYear()}-${d.getUTCMonth() + 1}-${d.getUTCDate()}`;
  const stored = JSON.parse(localStorage.getItem("dailyVerse") || "{}");

if (stored.date === today) {
    dailyKey = stored.key;
  } else {
    cachedPool = null; // Clear cache to allow daily roll calculation
    const pool = buildWeightedPool();
    const dateSeed = getSeed(today);
    
    dailyKey = pool[dateSeed % pool.length];

    localStorage.setItem("dailyVerse", JSON.stringify({
      date: today,
      key: dailyKey
    }));
  }

  currentKey = dailyKey;
  addToRecent(dailyKey);
  updateVerse("Daily Bible Verse");
  updateStreak();
}

function showDaily() {
  if (typeof trackAppEvent === 'function') {
    trackAppEvent('view_mode_change', { 'mode': 'daily' });
  }
  currentKey = dailyKey;
  updateVerse("Daily Bible Verse");
  dailyBtn.classList.add("active");
  randomBtn.classList.remove("active");
}

function showRandom() {
  if (typeof trackAppEvent === 'function') {
    trackAppEvent('view_mode_change', { 'mode': 'random' });
  }
  cachedPool = null; // Clear cache so a fresh pool calculation runs
  const pool = buildWeightedPool();
  const randomPool = pool.filter(ref => ref !== dailyKey);
  const activePool = randomPool.length ? randomPool : pool;

  currentKey = activePool[Math.floor(Math.random() * activePool.length)];
  addToRecent(currentKey);
  
  updateVerse("Random Bible Verse");
  dailyBtn.classList.remove("active");
  randomBtn.classList.add("active");
}

function changeTranslation(t) {
  if (typeof trackAppEvent === 'function') {
    trackAppEvent('change_translation', { 'to_translation': t });
  }
  translation = t;
  if (!verses[translation] || !Object.keys(verses[translation]).length) {
    loadTranslation(t).then(() => changeTranslation(t));
    return;
  }
  if (!verses[translation][currentKey]) {
    currentKey = verses[translation][dailyKey] ? dailyKey : Object.keys(verses[translation])[0];
  }
  updateVerse(dailyBtn.classList.contains("active") ? "Daily Bible Verse" : "Random Bible Verse");
}

function updateVerse(titleText) {
  const text = verses[translation][currentKey];
  if (!text) {
    console.warn("Missing verse:", currentKey, translation);
    return;
  }
  titleEl.innerText = titleText;
  verseEl.innerHTML = text.split(" ").map(w => `<span class="word">${w}</span>`).join(" ");
  refEl.innerText = currentKey;
  dateEl.innerText = new Date().toDateString();
  window.scrollTo(0, 0);
}

function updateStreak() {
  const today = new Date().toDateString();
  const lastVisit = localStorage.getItem("lastVisit");
  let streak = parseInt(localStorage.getItem("streak")) || 1;

  if (lastVisit && lastVisit !== today) {
    const [lastY, lastM, lastD] = lastVisit.split('-').map(Number);
    const [nowY, nowM, nowD] = today.split('-').map(Number);
    
    const lastDateObj = Date.UTC(lastY, lastM - 1, lastD);
    const nowDateObj = Date.UTC(nowY, nowM - 1, nowD);
    
    const diff = Math.floor((nowDateObj - lastDateObj) / 86400000);
    if (diff === 1) streak++;
    else if (diff > 1) streak = 1;
  }
  localStorage.setItem("streak", streak);
  localStorage.setItem("lastVisit", today);
  
  if (document.getElementById("streakNumber")) {
    document.getElementById("streakNumber").innerText = streak;
  }

  const sCount = document.getElementById("streakCount");
  const sMsg = document.getElementById("streakMsg");
  if (sCount && sMsg) {
    sCount.innerText = streak + " Days";
    if (streak < 7) sMsg.innerText = "Keep going — 7 days is your next milestone 🌿";
    else if (streak < 30) sMsg.innerText = "You're on fire — 30 days is next 🔥";
    else sMsg.innerText = "You're building something powerful 💪";
  }

  const streakHint = document.getElementById("streakHintBubble");
  const tapHint = document.getElementById("tapHintBubble");
  const hintStreakNum = document.getElementById("hintStreakNumber");

  if (hintStreakNum) hintStreakNum.innerText = streak;

  setTimeout(() => {
    if (streakHint) {
      streakHint.classList.add("show");
      setTimeout(() => {
        streakHint.classList.remove("show");
        setTimeout(() => {
          if (tapHint) {
            tapHint.classList.add("show");
            setTimeout(() => {
              tapHint.classList.remove("show");
            }, 5000);
          }
        }, 600);
      }, 4000);
    }
  }, 1000);
}

function openStreak() { streakModal.style.display = "flex"; }
function closeStreak() { streakModal.style.display = "none"; }

async function openHelp() {
  helpModal.style.display = "flex";
  helpContent.innerHTML = "Loading...";
  try {
    const res = await fetch("https://raw.githubusercontent.com/tapnpray/tapnpray.github.io/refs/heads/main/README.md");
    const text = await res.text();
    helpContent.innerHTML = marked.parse(text);
    helpContent.querySelectorAll("a").forEach(a => a.target = "_blank");
  } catch {
    helpContent.innerText = "Unable to load help content.";
  }
}
function closeHelp() { helpModal.style.display = "none"; }

function goDonate() {
  if (typeof trackAppEvent === 'function') {
    trackAppEvent('donation_intent');
  }
  donateIcon.classList.add("pulse");
  setTimeout(() => donateIcon.classList.remove("pulse"), 2000);
  window.open("https://venmo.com/u/tapnpray", "_blank");
}

async function loadTranslation(t) {
  try {
    const res = await fetch(`/BIBLE/${t.toUpperCase()}/${t.toUpperCase()}_bible.json`);
    if (!res.ok) return;
    const data = await res.json();
    Object.entries(data).forEach(([book, chapters]) => {
      Object.entries(chapters).forEach(([chapter, versesObj]) => {
        Object.entries(versesObj).forEach(([v, text]) => {
          verses[t][`${book} ${chapter}:${v}`] = text;
        });
      });
    });
  } catch (err) {
    console.error("Error loading translation:", err);
  }
}

/* =========================
   READ ALOUD & AUDIO
========================= */
function readVerse() {
  if (typeof trackAppEvent === "function") {
    trackAppEvent('read_aloud', {
      'verse_ref': currentKey,
      'translation': translation
    });
  }
  
  window.speechSynthesis.cancel(); 
  
  const words = document.querySelectorAll(".word");
  words.forEach(w => w.classList.remove("active"));
  
  const text = verses?.[translation]?.[currentKey];
  if (!text) return;

  // Wrap speech execution in a brief timeout to let mobile audio engines completely clear their queues
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(`${text} ... ${currentKey}`);
    const allVoices = window.speechSynthesis.getVoices();
    
    let premiumVoice = allVoices.find(voice => 
      voice.lang.includes('en') && 
      (voice.name.includes('Premium') || voice.name.includes('Natural') || voice.name.includes('Google US English'))
    );
    
    if (!premiumVoice) premiumVoice = allVoices.find(voice => voice.name.includes('Samantha') || voice.name.includes('Google'));
    if (!premiumVoice) premiumVoice = allVoices.find(voice => voice.lang.startsWith('en'));
    
    if (premiumVoice) u.voice = premiumVoice;

    u.rate = 0.90;
    u.pitch = 1.0;

    let wordIndex = 0;
    u.onboundary = (event) => {
      if (event.name === "word") {
        if (words[wordIndex]) {
          words.forEach(w => w.classList.remove("active"));
          words[wordIndex].classList.add("active");
          wordIndex++;
        }
      }
    };

    u.onend = () => { words.forEach(w => w.classList.remove("active")); };
    u.onerror = () => { words.forEach(w => w.classList.remove("active")); };

    window.speechSynthesis.speak(u);
  }, 50); // a brief 50ms pause keeps the click active and stable on iOS/Chrome
}

if (typeof window !== "undefined" && window.speechSynthesis) {
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }
}

let ambientOn = false;
function toggleAmbient() {
  if (typeof trackAppEvent === 'function') {
    trackAppEvent('ambient_toggle', { 'is_on': !ambientOn });
  }
  const a = ambientAudio;
  if (ambientOn) {
    if (typeof fadeOut === 'function') {
      fadeOut(a);
    } else {
      a.pause();
    }
  } else {
    a.volume = 0.5;
    a.play().catch(()=>{});
    if (typeof fadeIn === 'function') {
      fadeIn(a);
    }
  }
  ambientOn = !ambientOn;
  ambientToggle.classList.toggle("active");
}
