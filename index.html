function getTimeBlock() {
  const h = new Date().getHours();
  if (h < 11) return "morning";
  if (h < 17) return "day";
  if (h < 21) return "evening";
  return "night";
}

function updateBackground() {
  const block = getTimeBlock();
  const set = bgSets[block];
  const img = set[Math.floor(Math.random() * set.length)];
  const brightness = (block === "night" || block === "evening") ? 0.75 : 1.0;

  // Prevent unnecessary re-renders
  if (img === currentBackground && brightness === currentBrightness) return;

  const preload = new Image();
  preload.src = img;

  preload.onload = () => {
    const bg = document.getElementById("bg-layer");

    const temp = new Image();
    temp.src = img;

    temp.onload = () => {
      bg.style.backgroundImage = `url('${img}')`;
      document.body.style.setProperty('--brightness', brightness);
      document.body.dataset.block = block;

      currentBackground = img;
      currentBrightness = brightness;
    };
  };
}

/* SEASONAL BOOSTS */
function getEasterDate(year) {
  const f = Math.floor;
  const G = year % 19;
  const C = f(year / 100);
  const H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30;
  const I = H - f(H / 28) * (1 - f(29 / (H + 1)) * f((21 - G) / 11));
  const J = (year + f(year / 4) + I + 2 - C + f(C / 4)) % 7;
  const L = I - J;
  const month = 3 + f((L + 40) / 44);
  const day = L + 28 - 31 * f(month / 4);

  return new Date(year, month - 1, day);
}

function getSeasonalBoosts() {
  const today = new Date();

  if (diffDays === 0) return ["Matthew 28:6"]; // Easter Sunday
  if (diffDays === -2) return ["Luke 23:46"]; // Good Friday
  if (diffDays >= -3 && diffDays <= 3) return ["John 3:16"];

  return [];
}
/* =========================
   BUILD WEIGHTED POOL (OPTIMIZED + SAFE CACHE)
========================= */

let cachedPool = null;
let poolBuildTime = 0;

let recentVerses = JSON.parse(localStorage.getItem("recentVerses") || "[]");
const RECENT_LIMIT = 14; // last 14 verses remembered
const CACHE_DURATION = 60000; // 60 seconds

function buildWeightedPool() {
  const now = Date.now();

  // =====================
  // CACHE CHECK (FIXED)
  // =====================
  if (cachedPool && (now - poolBuildTime < CACHE_DURATION)) {
    return cachedPool;
  }

  let pool = [];

  // =====================
  // BASE CURATED VERSES
  // =====================
  curatedVerses.forEach(v => {
    for (let i = 0; i < v.weight; i++) {
      pool.push(v.ref);
    }
  });

  // =====================
  // SEASONAL BOOSTS
  // =====================
  const seasonal = getSeasonalBoosts();
  seasonal.forEach(ref => {
    for (let i = 0; i < 6; i++) {
      pool.push(ref);
    }
  });

  // =====================
  // RECENT VERSE FILTERING
  // =====================
  let filtered = pool.filter(v => !recentVerses.includes(v));

  // =====================
  // FALLBACK SAFETY NET
  // =====================
  if (filtered.length < 20) {
    recentVerses = [];
    localStorage.setItem("recentVerses", JSON.stringify(recentVerses));
    filtered = pool;
  }

  // =====================
  // FINAL CACHE UPDATE
  // =====================
  cachedPool = filtered.length ? filtered : pool;
  poolBuildTime = now;

  return cachedPool;
}

/* =========================
   VERSES
========================= */
let verses = { nlt:{}, niv:{}, kjv:{} };
let translation = "nlt";
let dailyKey = "";
let currentKey = "";

async function loadTranslation(t) {
  try {
    // ✅ Prevent re-loading if already in memory
    if (verses[t] && Object.values(verses[t]).length) return;

    const res = await fetch(`/BIBLE/${t.toUpperCase()}/${t.toUpperCase()}_bible.json`);
    
    if (!res.ok) {
      console.error("Failed to load:", t);
      return;
    }

    const data = await res.json();

    Object.entries(data).forEach(([book, chapters]) => {
      Object.entries(chapters).forEach(([chapter, versesObj]) => {
        Object.entries(versesObj).forEach(([v, text]) => {
          verses[t][`${book} ${chapter}:${v}`] = text;
        });
      });
    });

  } catch (err) {
    console.error("Translation load error:", err);
  }
}

function getSeed(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = (h << 5) - h + s.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function generateDaily() {
  cachedPool = null;
  const today = new Date().toDateString();
  const stored = JSON.parse(localStorage.getItem("dailyVerse") || "{}");

  if (stored.date === today) {
    dailyKey = stored.key;
  } else {
    const keys = buildWeightedPool();
    if (!keys.length) return;

    dailyKey = keys[getSeed(today) % keys.length];

    localStorage.setItem("dailyVerse", JSON.stringify({
      date: today,
      key: dailyKey
    }));
  }

currentKey = dailyKey;
updateVerse("Daily Bible Verse");
updateStreak();
addToRecent(dailyKey);
}

function showDaily() {
  currentKey = dailyKey;
  updateVerse("Daily Bible Verse");

  dailyBtn.classList.add("active");
  randomBtn.classList.remove("active");
}

function showRandom() {
  const keys = buildWeightedPool();
  if (!keys.length) return;

  currentKey = keys[Math.floor(Math.random() * keys.length)];
  updateVerse("Random Bible Verse");
  addToRecent(currentKey);

  dailyBtn.classList.remove("active");
  randomBtn.classList.add("active");
}

function changeTranslation(t) {
  translation = t;

  if (!verses[translation] || !Object.keys(verses[translation]).length) return;

  if (!verses[translation][currentKey]) {
    currentKey = verses[translation][dailyKey]
      ? dailyKey
      : Object.keys(verses[translation])[0];
  }

  updateVerse(
    dailyBtn.classList.contains("active")
      ? "Daily Bible Verse"
      : "Random Bible Verse"
  );
}

  const text = verses[translation][currentKey];

  if (!text) {

  }

}
/* =========================
   STREAK
========================= */
function updateStreak() {
  const today = new Date().toDateString();
  const lastVisit = localStorage.getItem("lastVisit");

  let streak = parseInt(localStorage.getItem("streak"));
  if (isNaN(streak)) streak = 0;

  if (lastVisit) {
    const last = new Date(lastVisit);
    const now = new Date(today);

    const diff = Math.floor((now - last) / 86400000);

    if (diff === 1) {
      streak += 1;
    } else if (diff > 1) {
      streak = 1;
    }
  } else {
    // first ever visit
    streak = 1;
  }

  // save updates
  localStorage.setItem("streak", streak);
  localStorage.setItem("lastVisit", today);

  // update UI safely
  const streakNum = document.getElementById("streakNumber");
  if (streakNum) {
    streakNum.innerText = streak;
  }

  streakEl.classList.add("active");
  streakCount.innerText = `${streak} Days`;

  // messaging
  if (streak < 7) {
    streakMsg.innerText = "Keep going — 7 days is your next milestone 🌿";
  } else if (streak < 30) {
    streakMsg.innerText = "You're on fire — 30 days is next 🔥";
  } else if (streak < 100) {
    streakMsg.innerText = "Stay strong — 100 days is next 👑";
  } else {
    streakMsg.innerText = "You're building something powerful 💪";
  }

  // badges
  b7.classList.toggle("active", streak >= 7);
  b30.classList.toggle("active", streak >= 30);
  b100.classList.toggle("active", streak >= 100);

  // progress logic
  let goal = 7;
  if (streak >= 7) goal = 30;
  if (streak >= 30) goal = 100;

  const progress = (streak / goal) * 100;
  progressBar.style.width = `${Math.min(progress, 100)}%`;
}

/* =========================

let speaking = false;

function readVerse() {
  if (speaking) return;
  speaking = true;

  // Stops any current speaking before starting the new one
  window.speechSynthesis.cancel(); 
  
  const words = verseEl.children;
  words.forEach(w => w.classList.remove("active"));
  let wordIndex = 0;

  const text = verses?.[translation]?.[currentKey];
  if (!text) return;

  const u = new SpeechSynthesisUtterance(text + " " + currentKey);

  u.rate = 0.95;
  u.pitch = 1;

  u.onboundary = (event) => {
    if (event.name === "word") {
      if (words[wordIndex]) {
        words[wordIndex].classList.add("active");
        wordIndex++;
      }
    }
  };

  setTimeout(() => {
    speechSynthesis.speak(u);
  }, 100);

  u.onend = () => speaking = false;
}

/* =========================
   AMBIENT
========================= */
let ambientOn = false;

function toggleAmbient() {
  // 🛡️ Safety guard (prevents iOS / undefined crashes)
  if (!ambientAudio) return;

  const a = ambientAudio;

  if (ambientOn) {
    fadeOut(a);
  } else {
    a.volume = 0;

    // prevents autoplay crash spam on mobile
    const playPromise = a.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {});
    }

    fadeIn(a);
  }

  ambientOn = !ambientOn;
  ambientToggle.classList.toggle("active");
}

function fadeIn(a) {
  if (!a) return;

  let v = 0;
  const i = setInterval(() => {
    v += 0.05;

    if (v >= 0.3) {
      v = 0.3;
      clearInterval(i);
    }

    a.volume = v;
  }, 100);
}

function fadeOut(a) {
  if (!a) return;

  let v = a.volume;

  const i = setInterval(() => {
    v -= 0.05;

    if (v <= 0) {
      clearInterval(i);

      a.pause();
      a.currentTime = 0;
      a.volume = 0; // 🧼 ensures no ghost audio state
    }

    a.volume = v;
  }, 100);
}

async function renderShareBackground(ctx, size, currentBackground, verseText, currentKey) {

  ========================= */

  const bgImg = new Image();

  bgImg.src = currentBackground + "?t=" + Date.now();

  await new Promise((resolve) => {
    bgImg.onload = resolve;
    bgImg.onerror = resolve;
  });

  if (bgImg.complete && bgImg.width > 0) {
    const scale = Math.max(size / bgImg.width, size / bgImg.height);
    const drawW = bgImg.width * scale;
    const drawH = bgImg.height * scale;
    const offX = (size - drawW) / 2;
    const offY = (size - drawH) / 2;

    ctx.filter = "blur(18px) brightness(0.6)";

    ctx.drawImage(
      bgImg,
      offX - 100,
      offY - 100,
      drawW + 200,
      drawH + 200
    );

    await new Promise(r => setTimeout(r, 15));

    ctx.drawImage(
      bgImg,
      offX - 100,
      offY - 100,
      drawW + 200,
      drawH + 200
    );

    ctx.filter = "none";
  } else {
    ctx.fillStyle = "#0b1a2a";
    ctx.fillRect(0, 0, size, size);
  }

  /* =========================
     2. GLASS CARD
  ========================= */
  const cardX = 80, cardY = 160, cardW = 920, cardH = 650, r = 40;

  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.beginPath();

  if (ctx.roundRect) {
    ctx.roundRect(cardX, cardY, cardW, cardH, r);
  } else {
    ctx.rect(cardX, cardY, cardW, cardH);
  }

  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  ctx.lineWidth = 2;
  ctx.stroke();

  /* =========================
     3. TEXT DYNAMICS
  ========================= */

  ctx.textAlign = "center";

  ctx.fillText("Daily Bible Verse", size / 2, cardY + 70);

  // Date

  ctx.fillText(new Date().toDateString(), size / 2, cardY + 110);

  // Verse text
  let fontSize = verseText.length > 180 ? 36 : 46;
  ctx.font = `700 ${fontSize}px Merriweather`;
  ctx.fillStyle = "#ffffff";

  const words = verseText.split(" ");
  const lines = [];
  let currentLine = "";
  const maxWidth = cardW - 140;

  for (const word of words) {
    const testLine = currentLine + word + " ";

    if (ctx.measureText(testLine).width > maxWidth) {
      lines.push(currentLine.trim());
      currentLine = word + " ";
    } else {
      currentLine = testLine;
    }
  }

  lines.push(currentLine.trim());

  const lineHeight = fontSize * 1.4;
  const totalTextHeight = lines.length * lineHeight;
  const startY = cardY + 200 + ((cardH - 320 - totalTextHeight) / 2);

  lines.forEach((l, i) => {
    ctx.fillText(l, size / 2, startY + (i * lineHeight));
  });

  /* =========================
     4. REFERENCE
  ========================= */

  ctx.font = "700 34px Merriweather";
  ctx.fillStyle = "#2fb4ff";
  ctx.fillText(currentKey, size / 2, cardY + cardH - 60);

  ctx.font = "700 22px Merriweather";
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("tapnpray.github.io", size / 2, size - 60);
}

    ctx.font = "700 22px Merriweather";

// =========================
// 6. EXPORT (SAFE + iOS STABLE)

canvas.toBlob((blob) => {

async function shareVerse() {
  if (isSharing) return;
  isSharing = true;

  try {
    const canvas = document.createElement("canvas");
    const size = 1080;
    canvas.width = size;
    canvas.height = size;

    const ctx = canvas.getContext("2d");

    // Pull current verse safely
    const verseText = verses?.[translation]?.[currentKey] || "";
    const keyText = currentKey || "";

    // =========================
    // 1. BACKGROUND RENDER
    // =========================
    await renderShareBackground(
  ctx,
  size,
  currentBackground,
  verseText,
  currentKey
);

    // =========================
    // 2. GLASS CARD
    // =========================
    const cardX = 80, cardY = 160, cardW = 920, cardH = 650, r = 40;

    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(cardX, cardY, cardW, cardH, r);
    } else {
      ctx.rect(cardX, cardY, cardW, cardH);
    }
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // =========================
    // 3. TITLE
    // =========================
    ctx.textAlign = "center";

    ctx.fillStyle = "#fff";
    ctx.font = "700 32px Merriweather";
    ctx.fillText("Daily Bible Verse", size / 2, cardY + 70);

    ctx.fillStyle = "#2fb4ff";
    ctx.font = "400 24px Merriweather";
    ctx.fillText(new Date().toDateString(), size / 2, cardY + 110);

    // =========================
    // 4. VERSE WRAP
    // =========================
    const words = verseText.split(" ");
    const lines = [];
    let currentLine = "";
    const maxWidth = cardW - 140;

    ctx.font = "700 44px Merriweather";
    ctx.fillStyle = "#fff";

    words.forEach(word => {
      const test = currentLine + word + " ";
      if (ctx.measureText(test).width > maxWidth) {
        lines.push(currentLine.trim());
        currentLine = word + " ";
      } else {
        currentLine = test;
      }
    });

    lines.push(currentLine.trim());

    const lineHeight = 54;
    const startY = cardY + 240;

    lines.forEach((l, i) => {
      ctx.fillText(l, size / 2, startY + i * lineHeight);
    });

    // =========================
    // 5. VERSE REF
    // =========================
    ctx.fillStyle = "#2fb4ff";
    ctx.font = "700 34px Merriweather";
    ctx.fillText(keyText, size / 2, cardY + cardH - 60);

    // =========================
    // 6. EXPORT
    // =========================
    canvas.toBlob(async (blob) => {
      if (!blob) {
        isSharing = false;
        return;
      }

      const file = new File([blob], "tapnpray.png", {
        type: "image/png"
      });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: "Tap N Pray",
            text: `${verseText}\n\n${keyText}`
          });
        } catch (err) {
          if (err.name !== "AbortError") {
            openShareModalWithBlob(blob);
          }
        }
      } else {
        openShareModalWithBlob(blob);
      }

      shareBtn.style.opacity = "1";
      isSharing = false;
    }, "image/png");

  } catch (err) {
    console.error("shareVerse error:", err);
    isSharing = false;
    shareBtn.style.opacity = "1";
  }
}
